name: Paperless Integration

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/paperless-integration.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "paperless-api-macros/**"
      - "src/**"
      - "tests/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paperless:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Start Paperless
        run: |
          docker compose --file tests/docker-compose.paperless-integration.yml pull --quiet
          docker compose --file tests/docker-compose.paperless-integration.yml up --detach --wait
      - name: Install Rust (Stable)
        run: curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
      - uses: actions/cache@v5
        with:
          path: |
            ~/.rustup/
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run Paperless integration tests
        run: cargo test --release --locked --package paperless-api-integration-tests -- --nocapture
      - name: Stop Paperless
        if: always()
        run: |
          docker compose --file tests/docker-compose.paperless-integration.yml logs
          docker compose --file tests/docker-compose.paperless-integration.yml down --volumes
